name: Compile Examples

on: [push, pull_request]

jobs:
  compile:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          cli-version: 1.4.1
          fqbn: nuvoton:mcs51:n76e003
          platforms: |
            - name: nuvoton:mcs51
              source-url: https://raw.githubusercontent.com/is-tg/n76e003-core/main/package_nuvoton_index.json
          sketch-paths: |
            - examples
